name: NuGet Push from Codebelt
description: An opinionated action that downloads existing NuGet packages and pushes them to a package source and publishes them.
inputs:
  source:
    description: The NuGet source to push the packages to. Default is https://api.nuget.org/v3/index.json.
    required: false
    default: 'https://api.nuget.org/v3/index.json'
  verbosity-level:
    description: Sets the verbosity level of the command. Allowed values are quiet, normal and detailed. The default is quiet.
    required: true
    default: 'quiet'
runs:
  using: composite
  steps:
    - name: Push
      run: nuget push '${{ github.workspace }}/*.nupkg' -Source ${{ inputs.source }} -SkipDuplicate -Verbosity ${{ inputs.verbosity-level }}
      shell: bash
branding:
  icon: 'umbrella'
  color: 'blue'
